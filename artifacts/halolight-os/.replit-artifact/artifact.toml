kind = "web"
previewPath = "/"
title = "HaloLight OS"
version = "1.0.0"
id = "artifacts/halolight-os"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18205

[services.development]
run = "pnpm --filter @workspace/halolight-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/halolight-os", "run", "build" ]
publicDir = "artifacts/halolight-os/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18205"
BASE_PATH = "/"
