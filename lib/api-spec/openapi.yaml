                  total: { type: integer }
        "401": { description: Unauthorized }
        "403": { description: Forbidden }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── Users ─────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, clerkId, email, role, language, currency, createdAt]
      properties:
        id:
          type: string
        clerkId:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        fullName:
          type: ["string", "null"]
        companyName:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, client, coach, sales_rep]
        language:
          type: string
          enum: [en, fr, es, de, it, pl, pt, nl]
        currency:
          type: string
          default: EUR
        birthday:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        instagram:
          type: ["string", "null"]
        facebook:
          type: ["string", "null"]
        pinterest:
          type: ["string", "null"]
        tiktok:
          type: ["string", "null"]
        linkedin:
          type: ["string", "null"]
        businessType:
          type: ["string", "null"]
        mainMarket:
          type: ["string", "null"]
        photobooths:
          type: ["integer", "null"]
        businessGoal:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        companyName:
          type: string
        phone:
          type: string
        country:
          type: string
        city:
          type: string
        language:
          type: string
          enum: [en, fr, es, de, it, pl, pt, nl]
        currency:
          type: string
        birthday:
          type: string
        website:
          type: string
        instagram:
          type: string
        facebook:
          type: string
        pinterest:
          type: string
        tiktok:
          type: string
        linkedin:
          type: string
        businessType:
