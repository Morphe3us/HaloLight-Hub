        "200":
          description: Logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationLogList"

  /automation/run:
    post:
      operationId: runAutomation
      tags: [automation]
      summary: Run all enabled rules now
      responses:
        "200":
          description: Run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRunResult"

