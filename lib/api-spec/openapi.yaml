openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HaloLight OS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile and role management
  - name: notifications
    description: Notification inbox and preferences
  - name: onboarding
    description: Client onboarding progress

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Users ────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

    patch:
      operationId: updateCurrentUser
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      parameters:
        - in: query
          name: role
          schema:
            type: string
          description: Filter by role
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found

  # ─── Notifications ──────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      parameters:
        - in: query
          name: unread_only
          schema:
            type: boolean
          description: Filter to unread only
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401":
          description: Unauthorized

  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [notifications]
      summary: Get unread notification count
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "401":
          description: Unauthorized

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Not found

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Count of updated notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedCount"
        "401":
          description: Unauthorized

  /notifications/preferences:
    get:
      operationId: getNotificationPreferences
      tags: [notifications]
      summary: Get notification preferences for current user
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          description: Unauthorized

    put:
      operationId: updateNotificationPreferences
      tags: [notifications]
      summary: Update notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          description: Unauthorized

  # ─── Onboarding ─────────────────────────────────────────────────────────
  /onboarding/steps:
    get:
      operationId: listOnboardingSteps
      tags: [onboarding]
      summary: List all onboarding steps with user progress
      responses:
        "200":
          description: Onboarding steps with completion status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStepList"
        "401":
          description: Unauthorized

  /onboarding/steps/{stepId}/complete:
    patch:
      operationId: completeOnboardingStep
      tags: [onboarding]
      summary: Mark an onboarding step as complete
      parameters:
        - in: path
          name: stepId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Step marked complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStep"
        "404":
          description: Not found

  /onboarding/summary:
    get:
      operationId: getOnboardingSummary
      tags: [onboarding]
      summary: Get onboarding completion summary for current user
      responses:
        "200":
          description: Onboarding summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingSummary"
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── Users ─────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, clerkId, email, role, language, createdAt]
      properties:
        id:
          type: string
        clerkId:
          type: string
        email:
          type: string
        fullName:
          type: ["string", "null"]
        companyName:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, client, coach, sales_rep]
        language:
          type: string
          enum: [en, fr, es, de, it, pl, pt, nl]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        fullName:
          type: string
        companyName:
          type: string
        phone:
          type: string
        language:
          type: string
          enum: [en, fr, es, de, it, pl, pt, nl]

    UserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer

    # ─── Notifications ──────────────────────────────────────────────────────
    Notification:
      type: object
      required: [id, userId, type, title, body, isRead, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: string
        link:
          type: ["string", "null"]
        isRead:
          type: boolean
        deliveredEmail:
          type: boolean
        deliveredPush:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total:
          type: integer

    UnreadCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer

    UpdatedCount:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer

    NotificationPreferences:
      type: object
      required: [userId, emailEnabled, inAppEnabled]
      properties:
        userId:
          type: string
        emailEnabled:
          type: boolean
        inAppEnabled:
          type: boolean
        typeOverrides:
          type: object
          additionalProperties: true

    NotificationPreferencesUpdate:
      type: object
      properties:
        emailEnabled:
          type: boolean
        inAppEnabled:
          type: boolean
        typeOverrides:
          type: object
          additionalProperties: true

    # ─── Onboarding ─────────────────────────────────────────────────────────
    OnboardingStep:
      type: object
      required: [id, key, title, description, order, isRequired, category, pointsReward, completedAt]
      properties:
        id:
          type: string
        key:
          type: string
        title:
          type: string
        description:
          type: string
        order:
          type: integer
        isRequired:
          type: boolean
        category:
          type: string
        pointsReward:
          type: integer
        completedAt:
          type: ["string", "null"]
          format: date-time
        skippedAt:
          type: ["string", "null"]
          format: date-time

    OnboardingStepList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingStep"

    OnboardingSummary:
      type: object
      required: [totalSteps, completedSteps, requiredSteps, completedRequired, percentComplete]
      properties:
        totalSteps:
          type: integer
        completedSteps:
          type: integer
        requiredSteps:
          type: integer
        completedRequired:
          type: integer
        percentComplete:
          type: integer
